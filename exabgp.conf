process tvfilter {
	run python3 /path/to/tvfilter.py;
	encoder text;
}

template {
	neighbor tvfilter {
		router-id 100.64.0.2;
		local-as 64512;
		peer-as 64513;
		family {
			ipv4 unicast;
			ipv6 unicast;
		}
		capability {
			graceful-restart 10;
		}
		outgoing-ttl 2;
		incoming-ttl 2;
		api {
			processes [ tvfilter ];
		}
	}
}

neighbor 100.64.0.1 {
	inherit tvfilter;

	local-address 100.64.0.2;
	description "bgproutername";
}
